<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🕵️ Identity Agency — Évaluation 2nde</title>
<style>
:root{--n:#1B2A49;--n2:#2D4373;--a:#F5A623;--t:#14A38B;--r:#E5484D;--g:#2E9E5B;--bg:#EEF2FA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:#222;min-height:100vh}
.pg{max-width:760px;margin:0 auto;padding:14px 16px 90px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px rgba(27,42,73,.12);border-top:4px solid var(--a)}
h1,h2,h3{color:var(--n)}
.btn{border:0;border-radius:40px;padding:11px 22px;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--n);color:#fff;box-shadow:0 3px 0 #0b1426}
.btn:active{transform:translateY(2px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.a{background:var(--a);color:#3a2800;box-shadow:0 3px 0 #a86f0a}.btn.t{background:var(--t);box-shadow:0 3px 0 #0b6b5b}.btn.x{background:#ddd;color:#444;box-shadow:none}
input{border:2px solid #cfd6e6;border-radius:10px;padding:10px;font-size:1rem;width:100%;text-align:center}
.bar{position:sticky;top:0;z-index:5;background:var(--n);color:#fff;padding:9px 16px;display:flex;justify-content:space-between;font-weight:700}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ex{background:#fff;border-radius:16px;padding:16px;text-align:center;box-shadow:0 3px 12px rgba(27,42,73,.12);border-bottom:4px solid var(--t)}
.ex.d{border-color:var(--a);background:#FFF8E8}.ex .e{font-size:2rem}
.q{padding:12px 0;border-top:1px dashed #d5dbea}
.q p{font-weight:600;margin-bottom:8px}
.o{display:inline-block;margin:3px 4px 3px 0;padding:8px 14px;border:2px solid #cfd6e6;border-radius:30px;cursor:pointer;background:#fff;font-size:.9rem}
.o.s{border-color:var(--n2);background:#E3E9FA}.o.ok{border-color:var(--g);background:#E4F6EA}.o.ko{border-color:var(--r);background:#FDE8E8}.o.lk{cursor:default}
.msg{padding:10px 14px;border-radius:12px;font-weight:700;margin:10px 0}.w{background:#FFF1D6;color:#7a5200}.g{background:#E4F6EA;color:#17602f}
.st{color:var(--a);font-size:1.3rem;letter-spacing:2px}
.fab{position:fixed;bottom:14px;right:14px;z-index:9}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:7px;border-bottom:1px solid #e3e7f2;text-align:left}
input[readonly]{background:#F4F6FB}.dl{display:flex;align-items:center;gap:8px;margin:5px 0}.dl input{text-align:left;flex:1}.tks{display:flex;gap:7px;flex-shrink:0}.tkb{width:26px;height:26px;border-radius:50%;border:3px solid;cursor:pointer}.tkb:disabled{cursor:default;opacity:.55}
.dsc{display:grid;grid-template-columns:minmax(220px,38%) 1fr;gap:16px;margin-top:12px}.dsc>div:first-child{position:sticky;top:46px;align-self:start;z-index:3;background:#fff}.dsc img{width:100%;border-radius:14px;display:block}
@media(max-width:700px){.dsc{grid-template-columns:1fr}.dsc img{max-height:30vh;width:auto;margin:auto}}
@media print{.noprint,.fab,.bar{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
</style></head><body><div id="bar"></div><div id="app"></div><div id="fab"></div>
<script>
const K='idagency_',STUCODE='AGENCY',PROFCODE='0504';
/* q:[question,[options],indexBonneReponse] */
const T=(s,v,f,w,a,ap)=>[`<b>${s}</b> — <b>${v}</b> — <i>${f}</i> — <b>${w}</b><br><small>✍️ Écris la phrase complète en anglais.</small>`,'T',a,ap];
const FR=["fiable","drôle","courageux/se","décontracté(e)","amical(e)","serviable","honnête","gentil(le)"];
const EX=[
{k:'be',e:'🪪',t:'Be',d:'Le verbe « be » : 5 QCM + 5 phrases à construire',r:"be : I am / you are / he-she-it is / we-you-they are. Négation : am not, isn't, aren't.",q:[
["She ___ a teacher.",["is","are","am"],0],
["My parents ___ at home. (négatif)",["aren't","isn't","don't"],0],
["I ___ not tired.",["am","is","are"],0],
["He ___ Spanish. (négatif)",["isn't","aren't","don't"],0],
["We ___ in the same class.",["is","are","am"],1],
T('SHE','BE','forme négative','HAPPY','she is not happy','is'),
T('I','BE','forme affirmative','A STUDENT','i am a student','is'),
T('THEY','BE','forme négative','AT SCHOOL TODAY','they are not at school today','is'),
T('YOU','BE','forme affirmative','VERY KIND','you are very kind','is'),
T('HE','BE','forme négative','A DOCTOR','he is not a doctor','is')]},
{k:'have',e:'🎒',t:'Have',d:'Le verbe « have » : 5 QCM + 5 phrases à construire',r:"have : I/you/we/they have, he/she/it has. Négation : don't have / doesn't have.",q:[
["He ___ a blue bike.",["have","has","haves"],1],
["I ___ two brothers.",["has","have","am"],1],
["She ___ a dog. (négatif)",["doesn't have","don't have","not has"],0],
["They ___ a big house.",["have","has","haves"],0],
["My sister ___ long hair. (négatif)",["doesn't have","don't have","not has"],0],
T('SHE','HAVE','forme affirmative','A RED BAG','she has a red bag','has'),
T('THEY','HAVE','forme négative','A CAR','they do not have a car','has'),
T('HE','HAVE','forme négative','BLUE EYES','he does not have blue eyes','has'),
T('WE','HAVE','forme affirmative','A BIG GARDEN','we have a big garden','has'),
T('YOU','HAVE','forme négative','A PEN','you do not have a pen','has')]},
{k:'ps',e:'⏰',t:'Present simple',d:'Présent simple : 5 QCM + 5 phrases à construire',r:"Présent simple : he/she/it + s (plays, goes, does, teaches, studies). Négation : don't / doesn't + verbe sans -s.",q:[
["My brother ___ football on Sundays.",["play","plays","playing"],1],
["They ___ to school by bus.",["go","goes","going"],0],
["She ___ like pizza.",["don't","isn't","doesn't"],2],
["We ___ TV in the morning.",["don't watch","doesn't watch","aren't watch"],0],
["The teacher ___ English.",["teach","teachs","teaches"],2],
T('SHE','LIKE','forme négative','COFFEE','she does not like coffee',''),
T('ANNA','STUDY','forme affirmative','ENGLISH','anna studies english',''),
T('THEY','GO','forme négative','TO SCHOOL ON SATURDAY','they do not go to school on saturday',''),
T('I','LIVE','forme affirmative','IN FRANCE','i live in france',''),
T('MY MOTHER','WORK','forme négative','ON SUNDAY','my mother does not work on sunday','')]},
{k:'hh',e:'👥',t:'His / Her',d:'Adjectifs possessifs his et her',r:"his = à lui (possesseur masculin) ; her = à elle (possesseur féminin). On regarde le possesseur, pas l'objet.",q:[
["Anna is my friend. ___ hair is long.",["His","Her","Its"],1],
["Tom has a dog. ___ dog is brown.",["His","Her","He"],0],
["My mother likes tea. This is ___ cup.",["his","her","she"],1],
["Look at Paul! ___ glasses are new.",["Her","His","She"],1],
["My dad is tall. ___ eyes are green.",["Her","He","His"],2]]},
{k:'app',e:'👓',t:'Appearance',d:"Vocabulaire de l'apparence",r:"Relis la liste : tall, short, medium-height, athletic, slim, fit, curvy, curly / wavy / straight hair, freckles, beard, moustache, glasses…",q:[
["« cheveux bouclés »",["wavy hair","curly hair","straight hair"],1],
["« taches de rousseur »",["freckles","glasses","beard"],0],
["athletic =",["mince","sportif/ve","grand(e)"],1],
["« yeux verts »",["green eyes","blue eyes","brown eyes"],0],
["« mince »",["strong","curvy","slim"],2],
["medium-height =",["petit(e)","de taille moyenne","jeune"],1]]},
{k:'per',e:'😊',t:'Personality',d:'Matching : associe chaque adjectif à sa traduction',m:1,r:"Relis la liste : friendly, kind, helpful, honest, brave, reliable, funny, easy-going, hard-working, confident…",q:[
["friendly",FR,4],["kind",FR,7],["funny",FR,1],["brave",FR,2],["honest",FR,6],["reliable",FR,0],["helpful",FR,5],["easy-going",FR,3]]}
];
const nm=(s,ap)=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/(\w+)n't/g,'$1 not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'s\b/g,ap?' '+ap:'s').replace(/[^a-z0-9]/g,'');
const isT=q=>q[1]==='T';
const okq=(q,v)=>isT(q)?(v!=null&&nm(v,q[3])===q[2].replace(/[^a-z0-9]/g,'')):v===q[2];
const gv=(q,v)=>v==null||v===''?'—':(isT(q)?v:q[1][v]);
const gc=q=>isT(q)?q[2].charAt(0).toUpperCase()+q[2].slice(1):q[1][q[2]];
const TOT=EX.reduce((a,x)=>a+x.q.length,0);
let S=null,scr='home',back='hub',tmr=null,tmpId='';
const $=id=>document.getElementById(id);
const save=()=>{try{S&&localStorage.setItem(K+S.id,JSON.stringify(S))}catch(e){}};
const load=id=>{try{return JSON.parse(localStorage.getItem(K+id))}catch(e){return null}};
const sc=k=>{const x=S.ex[k];return EX.find(e=>e.k===k).q.filter((q,i)=>okq(q,x.a[i])).length};
const total=()=>EX.reduce((n,e)=>n+(S.ex[e.k].p===2?sc(e.k):0),0);
const stars=(n,m)=>'<span class="st">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(m-n)+'</span></span>';
const b=(t,f,c='',x='')=>`<button class="btn ${c}" ${x} onclick="${f}">${t}</button>`;
function go(s){scr=s;render();scrollTo(0,0)}
function render(){
  const inG=S&&!['home','slog','plog','prof','rgpd','resume'].includes(scr);
  $('bar').innerHTML=inG?`<div class="bar noprint"><span>🕵️ ${S.id}</span><span>⭐ ${total()}/${TOT}</span><span>✍️ ${S.d.p===2?dpts():'—'}/20</span></div>`:'';
  $('fab').innerHTML=inG&&scr!=='rep'?`<div class="fab noprint">${b('📄 Bilan PDF',"back=scr;go('rep')",'a')}</div>`:'';
  $('app').innerHTML='<div class="pg"'+(scr==='desc'?' style="max-width:1000px"':'')+'>'+view()+'</div>';
}
function view(){
  if(scr==='home')return vHome();
  if(scr==='slog')return vLog(false);if(scr==='plog')return vLog(true);
  if(scr==='prof')return `<div class="card"><h2>👔 Espace prof</h2><p style="margin:12px 0">Code d'accès élèves : <strong style="font-size:1.4rem">${STUCODE}</strong></p><p style="color:#666;font-size:.9rem;margin-bottom:14px">Évaluation : ${TOT} questions = ${TOT} points = ${TOT} étoiles. Conjugaison/vocabulaire : 1 point par bonne réponse, une correction possible par exercice. Rédaction : note sur 20 ; le code prof est demandé pour cocher les phrases (🟢 2 pts, 🟠 1 pt, 🔴 0 pt).</p>${b('← Accueil',"go('home')",'x')}</div>`;
  if(scr==='rgpd')return vRgpd();
  if(scr==='resume')return `<div class="card"><h2>Progression retrouvée</h2><p style="margin:12px 0">Une partie existe pour <strong>${tmpId}</strong>.</p>${b('▶ Reprendre',"S=load(tmpId);start()",'t')} ${b('↺ Reprendre à zéro',"newGame(tmpId)",'x')}</div>`;
  if(scr==='hub')return vHub();
  if(scr==='desc')return vDesc();
  if(scr.startsWith('ex:'))return vEx(scr.slice(3));
  if(scr==='rep')return vRep();
}
function vHome(){return `<div style="text-align:center;padding-top:30px"><div style="font-size:3rem">🕵️</div><h1 style="margin:8px 0">Identity Agency</h1><p style="color:#555;margin-bottom:22px">Évaluation en anglais — 2nde • Résous les 7 dossiers et gagne un maximum d'étoiles !</p><div class="card" style="display:inline-block;min-width:240px;margin:6px">${b('🎯 Espace élèves',"go('slog')",'a')}</div><div class="card" style="display:inline-block;min-width:240px;margin:6px">${b('👔 Espace prof',"go('plog')")}</div><p style="margin-top:26px;font-size:.8rem;color:#777">Créé par <strong>C. Iemfre</strong> • <a href="#" onclick="go('rgpd');return false">🔒 RGPD</a></p></div>`}
function vLog(p){return `<div class="card"><h2>${p?'👔 Accès prof':'🎯 Connexion élève'}</h2><p style="margin:12px 0 6px;font-size:.9rem">Code d'accès</p><input id="c" type="password">${p?'':`<p style="margin:12px 0 6px;font-size:.9rem">2 premières lettres du prénom + 2 premières lettres du nom</p><div style="display:flex;gap:8px"><input id="f" maxlength=2 placeholder="JO"><input id="l" maxlength=2 placeholder="SM"></div>`}<p id="er" style="color:var(--r);font-weight:700;min-height:20px;margin:8px 0"></p>${b('Valider →',p?'doP()':'doS()','t')} ${b('← Retour',"go('home')",'x')}</div>`}
function doP(){$('c').value.toUpperCase()===PROFCODE?go('prof'):$('er').textContent='Code incorrect.'}
function doS(){const c=$('c').value.toUpperCase(),f=$('f').value.replace(/[^a-z]/gi,'').toUpperCase(),l=$('l').value.replace(/[^a-z]/gi,'').toUpperCase();
  if(c!==STUCODE)return $('er').textContent='Code incorrect.';if(f.length<2||l.length<2)return $('er').textContent='Renseigne 2 lettres pour le prénom et 2 pour le nom.';
  tmpId=f+'-'+l;const sv=load(tmpId);if(sv&&sv.t0){go('resume')}else newGame(tmpId)}
function newGame(id){S={id,t0:Date.now(),ex:{},d:{a:{},g:{},p:0,u:0}};EX.forEach(e=>S.ex[e.k]={a:{},a1:null,p:0});start()}
function start(){S.d=S.d||{a:{},g:{},p:0,u:0};save();go(S.d.p===1?'desc':'hub')}
function vHub(){const done=EX.filter(e=>S.ex[e.k].p===2).length,d=S.d;
  const cards=EX.map(e=>{const x=S.ex[e.k],dn=x.p===2;return `<div class="ex ${dn?'d':''}"><div class="e">${e.e}</div><h3>${e.t}</h3><p style="font-size:.82rem;color:#666;margin:6px 0 10px">${e.d}</p>${dn?stars(sc(e.k),e.q.length)+`<div style="font-weight:700;margin-top:4px">${sc(e.k)}/${e.q.length}</div>`:b(x.p?'Continuer':'Ouvrir le dossier',`go('ex:${e.k}')`,'t')}</div>`}).join('');
  const dc=`<div class="ex ${d.p===2?'d':''}"><div class="e">🖼️</div><h3>Describe a person</h3><p style="font-size:.82rem;color:#666;margin:6px 0 10px">Rédige 10 phrases sur Emma (note sur 20, corrigée par le prof)</p>${d.p===2?`<div style="font-weight:700">${dpts()} / 20</div>`:b(d.p?'Continuer':'Ouvrir le dossier',"go('desc')",'t')}</div>`;
  return `<div class="card"><h2>Tableau d'accueil</h2><p style="color:#555;margin-top:6px;font-size:.92rem">Choisis les dossiers dans l'ordre que tu veux. Dans les 6 premiers, tu peux te corriger <strong>une seule fois</strong>, puis le dossier est verrouillé (1 bonne réponse = 1 ⭐, ${TOT} ⭐ possibles). Le dossier « Describe a person » est noté sur 20 par ton professeur.</p></div><div class="hub">${cards}${dc}</div>${done===EX.length&&d.p===2?`<div class="card" style="margin-top:14px;text-align:center"><h2>🎉 Tous les dossiers sont résolus !</h2><p style="margin:8px 0 12px">Note 1 : ${total()}/${TOT} ⭐ • Note 2 : ${dpts()}/20</p>${b('📄 Voir mon bilan',"back='hub';go('rep')",'a')}</div>`:''}`}
function vEx(k){const E=EX.find(e=>e.k===k),x=S.ex[k],L=x.p===2;
  const rows=E.q.map((q,i)=>{const ok=okq(q,x.a[i]),lock=L||(x.p===1&&ok);let os;
    const fix=`<span class="o ${ok?'ok':'ko'} lk">${gv(q,x.a[i])}</span>${L&&!ok?` → <b>${gc(q)}</b>`:''}`;
    if(isT(q))os=lock?fix:`<input value="${(x.a[i]||'').replace(/"/g,'&quot;')}" placeholder="…" style="text-align:left" oninput="S.ex['${k}'].a[${i}]=this.value;save()">`;
    else if(E.m)os=lock?fix:`<select style="padding:9px;border-radius:10px;border:2px solid #cfd6e6;font-size:.95rem" onchange="pick('${k}',${i},this.value===''?undefined:+this.value)"><option value="">— choisis —</option>${q[1].map((o,oi)=>`<option value="${oi}" ${x.a[i]===oi?'selected':''}>${o}</option>`).join('')}</select>`;
    else os=q[1].map((o,oi)=>{let c='o';if(L){if(oi===q[2])c+=' ok';else if(x.a[i]===oi)c+=' ko'}else if(lock&&oi===q[2])c+=' ok';else if(x.a[i]===oi)c+=' s';if(lock)c+=' lk';
      return `<span class="${c}" ${lock?'':`onclick="pick('${k}',${i},${oi})"`}>${o}</span>`}).join('');
    const tag=x.p===1&&!ok?'<span style="color:#b36b00;font-weight:700"> ⚠ à revoir</span>':'';
    return `<div class="q"><p>${i+1}. ${q[0]}${E.m?' = ?':''}${tag}</p>${os}</div>`}).join('');
  const n=Object.values(x.a).filter(v=>v!==undefined&&v!=='').length;let foot;
  if(L)foot=`<div class="msg g">Dossier terminé : ${stars(sc(k),E.q.length)} ${sc(k)}/${E.q.length}</div>${b('Retour au tableau →',"go('hub')",'a')}`;
  else if(x.p===1)foot=`<div class="msg w">Certaines réponses sont fausses ou manquantes. Tu as <strong>une seule</strong> chance de les corriger, puis le dossier sera verrouillé.</div>${b('Valider définitivement',`validate('${k}')`,'t')}`;
  else foot=`<p style="color:#888;font-size:.85rem;margin:8px 0">${n}/${E.q.length} réponses. Tu peux changer d'avis avant de valider.${E.q.some(isT)?' Majuscules, espaces et contractions (isn\'t, she\'s…) sont acceptés.':''}</p>${b('Valider mes réponses',`validate('${k}')`,'t')}`;
  return `<div class="card"><h2>${E.e} ${E.t}</h2><p style="color:#666;font-size:.88rem">${E.d}</p>${rows}<div style="margin-top:14px">${foot}</div></div>`}
function pick(k,i,o){const x=S.ex[k];if(x.p===2)return;x.a[i]=o;save();render()}

const FRAMES=['About me','My appearance','My family','My pets','My talent'];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const dpts=()=>Object.values(S.d.g).reduce((a,v)=>a+v,0);
const pend=()=>[...Array(10).keys()].filter(i=>(S.d.a[i]||'').trim()&&S.d.g[i]==null).length;
function vDesc(){const d=S.d,p=d.p,dots=[[2,'#2E9E5B','Correcte : 2 points'],[1,'#F5A623','Partiellement correcte : 1 point'],[0,'#E5484D','Incorrecte : 0 point']];let rows='';
  if(p>=1)rows+=`<div class="dl" style="justify-content:flex-end;font-size:.75rem;color:#555"><span>Prof : 🟢 2 pts • 🟠 1 pt • 🔴 0 pt</span></div>`;
  for(let i=0;i<10;i++){const t=d.a[i]||'',aff=i%2===0;
    if(aff)rows+=`<div style="margin:12px 0 4px;font-weight:800;color:var(--n2)">📌 Cadre « ${FRAMES[i>>1]} »</div>`;
    const tk=p>=1?`<span class="tks">${dots.map(([v,c,l])=>`<button class="tkb" title="${l}" ${p===1&&d.u===1&&t.trim()?'':'disabled'} onclick="tk(${i},${v})" style="border-color:${c};background:${d.g[i]===v?c:'#fff'}"></button>`).join('')}</span>`:'';
    rows+=`<div class="dl"><span>${aff?'✅':'❌'}</span><input ${p?'readonly':''} value="${esc(t)}" placeholder="${aff?'Affirmative':'Negative'} sentence…" oninput="S.d.a[${i}]=this.value;save()">${tk}</div>`}
  let foot;const n=Object.values(d.a).filter(v=>v&&v.trim()).length;
  if(p===0)foot=`<p style="color:#888;font-size:.85rem;margin-bottom:8px">${n}/10 phrases écrites. Une ligne vide vaut 0 point.</p>${b('👩‍🏫 Je montre ce travail à mon professeur',"submitD()",'t')}`;
  else if(p===1){const r=pend();foot=`<div class="msg w">⏳ En attente de la correction du professeur. Ne ferme pas la page et ne poursuis pas avant la correction.</div>`+(d.u?`<div class="msg g">Mode correction : coche une pastille par phrase. Il reste ${r} phrase(s) à corriger.</div>${b('✅ Terminer la correction',"finishD()",'a',r?'disabled':'')}`:b('🔑 Correction prof',"unlockD()"))}
  else foot=`<div class="msg g">Dossier corrigé : ${dpts()} / 20</div>${b('Retour au tableau →',"go('hub')",'a')}`;
  return `<div class="card"><h2>🖼️ Describe a person</h2><div class="msg w" style="font-weight:600">Consigne : regarde la fiche d'Emma. Écris <b>10 phrases en anglais</b> sur elle : pour chacun des 5 cadres (About me, My appearance, My family, My pets, My talent), écris <b>1 phrase affirmative</b> et <b>1 phrase négative</b> (exemple sur un autre personnage : Tom has a dog. / Tom is not tall.). Tu peux utiliser tout le vocabulaire du jeu.</div><div class="dsc"><div><img src="${IMG}" alt="Fiche d'Emma"></div><div>${rows}<div style="margin-top:14px">${foot}</div></div></div></div>`}
function submitD(){if(!confirm("Montrer ce travail à ton professeur ? Tu ne pourras plus modifier tes phrases."))return;const d=S.d;for(let i=0;i<10;i++)if(!(d.a[i]||'').trim())d.g[i]=0;d.p=1;save();render();scrollTo(0,0)}
function unlockD(){const c=prompt('Code professeur');if(c&&c.toUpperCase()===PROFCODE){S.d.u=1;save();render()}else if(c!==null)alert('Code incorrect.')}
function tk(i,v){const d=S.d;if(d.u===1&&d.p===1&&(d.a[i]||'').trim()){d.g[i]=v;save();render()}}
function finishD(){if(pend())return;S.d.p=2;S.d.u=0;save();go('hub')}
const dr=()=>{const d=S.d,col=g=>g===2?'🟢 2':g===1?'🟠 1':g===0?'🔴 0':'⏳';
  const li=[...Array(10).keys()].map(i=>{const t=(d.a[i]||'').trim();return `<tr><td>${FRAMES[i>>1]} — ${i%2?'négative':'affirmative'}</td><td>${t?esc(t):'<i>(phrase manquante)</i>'}</td><td>${d.p===0?'—':col(t?d.g[i]:0)}</td></tr>`}).join('');
  return `<h3 style="margin:14px 0 4px">🖼️ Describe a person — ${d.p===2?dpts()+' / 20':d.p===1?'en attente de correction':'non fait : 0 / 20'}</h3><table>${li}</table><p style="font-size:.82rem;color:#666;margin-top:6px">🟢 correcte = 2 pts • 🟠 partiellement correcte = 1 pt • 🔴 incorrecte ou manquante = 0 pt. Pour progresser : relis tes phrases avec ton professeur et vérifie le sujet, le verbe (-s à he/she ; do not / does not) et l'orthographe.</p>`};
addEventListener('beforeunload',e=>{if(S&&S.d&&S.d.p===1){e.preventDefault();e.returnValue=''}});
function vRep(){const rows=EX.map(e=>{const x=S.ex[e.k],d=x.p===2;return `<tr><td>${e.e} ${e.t}</td><td>${d?sc(e.k)+' / '+e.q.length:'Non terminé — 0 / '+e.q.length}</td><td>${d?stars(sc(e.k),e.q.length):'—'}</td></tr>`}).join('');
  const det=EX.map(e=>{const x=S.ex[e.k],d=x.p===2;const li=d?e.q.map((q,i)=>{const f=x.a1&&okq(q,x.a1[i]),ok=okq(q,x.a[i]);return `<tr><td>${i+1}. ${q[0].replace(/<br>.*$/,'')}${E2(e)?' =':''}</td><td>${ok?'✓ 1':'✗ 0'}${ok&&!f?' (après correction)':''}</td><td>${ok?'':'Ta réponse : '+gv(q,x.a[i])+' → <strong>'+gc(q)+'</strong>'}</td></tr>`}).join(''):`<tr><td colspan=3>Dossier non terminé : 0 point.</td></tr>`;
    return `<h3 style="margin:14px 0 4px">${e.e} ${e.t}</h3><table>${li}</table>`}).join('');
  const rev=EX.filter(e=>S.ex[e.k].p!==2||sc(e.k)<e.q.length).map(e=>`<li style="margin:6px 0"><strong>${e.t} :</strong> ${e.r}</li>`).join('');
  const nd=EX.filter(e=>S.ex[e.k].p===2).length;
  return `<div class="card"><h1>🕵️ Identity Agency — Bilan</h1><p style="color:#666;margin:6px 0">Élève : <strong>${S.id}</strong> • ${new Date().toLocaleDateString('fr-FR')} • ${nd}/${EX.length} dossiers terminés</p>
  <div style="display:flex;gap:10px;margin:14px 0"><div style="flex:1;text-align:center;padding:14px;background:#FFF8E8;border-radius:14px"><div style="font-size:.75rem;color:#777">NOTE 1 — CONJUGAISON &amp; VOCABULAIRE</div><div style="font-size:2rem;font-weight:900;color:var(--n)">${total()} / ${TOT} ⭐</div></div><div style="flex:1;text-align:center;padding:14px;background:#E9F6F3;border-radius:14px"><div style="font-size:.75rem;color:#777">NOTE 2 — RÉDACTION</div><div style="font-size:2rem;font-weight:900;color:var(--n)">${S.d.p===2?dpts()+' / 20':S.d.p===1?'en attente':'0 / 20'}</div></div></div>
  <table><tr><th>Dossier</th><th>Points</th><th>Étoiles</th></tr>${rows}</table>${det}${dr()}
  <h3 style="margin:18px 0 6px">📚 Pour progresser</h3>${rev?`<ul style="padding-left:18px;font-size:.9rem">${rev}</ul><p style="font-size:.85rem;margin-top:8px">Relis ces rappels, corrige tes erreurs ci-dessus, puis refais le jeu pour battre ton score !</p>`:'<p>🏆 Parfait ! Aucune erreur, bravo agent !</p>'}
  <div class="noprint" style="margin-top:18px">${b('🖨️ Télécharger / imprimer en PDF','print()','a')} ${b('← Retour',"go(back)",'x')}</div></div>`}
function vRgpd(){return `<div class="card"><h2>🔒 Protection des données personnelles</h2>${['Cette application est un outil pédagogique développé pour un usage en classe.',
"Aucune donnée n'est transmise à un serveur externe : toutes les informations (nom d'équipe, identifiants, réponses, score, progression) restent uniquement stockées localement dans la mémoire de votre navigateur, sur l'appareil utilisé.",
"Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.",
"Les seules données saisies sont : le nom de votre équipe, les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices et votre progression dans le jeu.",
"Ces données sont conservées localement sur l'appareil utilisé, sous le nom de votre équipe, afin de vous permettre de reprendre votre progression lors d'une prochaine séance, sur ce même appareil. Elles ne sont jamais transmises, partagées, ni consultées par un tiers. Votre équipe peut à tout moment recommencer à zéro (la progression enregistrée est alors remplacée), ou effacer ces données en vidant les données de navigation de ce site dans votre navigateur.",
"Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur."].map(t=>`<p style="margin:10px 0;font-size:.9rem;line-height:1.7">${t}</p>`).join('')}${b('← Retour',"go('home')",'x')}</div>`}
addEventListener('pagehide',save);addEventListener('visibilitychange',save);
render();
</script></body></html>
